<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagonel - Monitor de Preços</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-border: rgba(239, 68, 68, 0.25);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.08);
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .noise {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header .badge {
            display: inline-block;
            background: var(--primary-glow);
            color: var(--primary);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            margin-bottom: 16px;
        }

        .header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Search Box */
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .input-min {
            max-width: 200px;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 0;
            display: none;
        }

        .loading.active { display: block; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Summary Cards */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
            display: none;
        }

        .summary.active { display: grid; }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .summary-card .value {
            font-family: 'Space Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .summary-card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-card.danger {
            border-color: var(--danger-border);
            background: var(--danger-bg);
        }

        .summary-card.danger .value {
            color: var(--danger);
        }

        .summary-card.success .value {
            color: var(--success);
        }

        /* Marketplace Results */
        .results { display: none; }
        .results.active { display: block; }

        .marketplace-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .marketplace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .marketplace-header .name {
            font-size: 18px;
            font-weight: 700;
        }

        .marketplace-header .stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .marketplace-header .stat {
            text-align: right;
        }

        .marketplace-header .stat .val {
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            font-weight: 700;
        }

        .marketplace-header .stat .lbl {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Offers Table */
        .offers-table {
            width: 100%;
            border-collapse: collapse;
        }

        .offers-table th {
            text-align: left;
            padding: 12px 24px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--surface2);
        }

        .offers-table td {
            padding: 14px 24px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        .offers-table tr:last-child td {
            border-bottom: none;
        }

        .offers-table .price {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 15px;
        }

        .offers-table .seller-name {
            font-weight: 500;
        }

        .offers-table a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
        }

        .offers-table a:hover {
            text-decoration: underline;
        }

        /* Below minimum highlight */
        .row-below-min {
            background: var(--danger-bg);
        }

        .row-below-min .price {
            color: var(--danger);
        }

        .badge-alert {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            display: none;
        }

        .empty-state.active { display: block; }

        /* Crawl4AI config */
        .config-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .config-toggle {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'DM Sans', sans-serif;
            padding: 4px 8px;
        }

        .config-toggle:hover {
            color: var(--text);
        }

        .config-panel {
            display: none;
            padding: 16px 0 0;
        }

        .config-panel.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-row {
                flex-direction: column;
            }
            .input-min { max-width: 100%; }
            .summary { grid-template-columns: 1fr; }
            .marketplace-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .offers-table { font-size: 13px; }
            .offers-table th, .offers-table td { padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="badge">Monitor de Preços</div>
            <h1>Zagonel Price Watch</h1>
            <p>Pesquise preços nos principais marketplaces e identifique vendas abaixo do mínimo</p>
        </div>

        <!-- Search -->
        <div class="search-box">
            <div class="search-row">
                <div class="input-group" style="flex: 2;">
                    <label>Produto</label>
                    <input type="text" id="product" placeholder="Ex: Ducha Zagonel Ducali" autofocus>
                </div>
                <div class="input-group input-min">
                    <label>Preço Mínimo (R$)</label>
                    <input type="number" id="minPrice" placeholder="0,00" step="0.01">
                </div>
                <button class="btn-search" id="btnSearch" onclick="doSearch()">Pesquisar</button>
            </div>

            <!-- Config -->
            <div class="config-bar">
                <button class="config-toggle" onclick="toggleConfig()">⚙ Configurações</button>
            </div>
            <div class="config-panel" id="configPanel">
                <div class="input-group">
                    <label>URL do Crawl4AI</label>
                    <input type="text" id="crawl4aiUrl" value="https://bot-crwal4ai.28o23w.easypanel.host" placeholder="http://localhost:11235">
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Pesquisando nos marketplaces...</p>
        </div>

        <!-- Summary -->
        <div class="summary" id="summary">
            <div class="summary-card">
                <div class="value" id="totalOffers">0</div>
                <div class="label">Total de Ofertas</div>
            </div>
            <div class="summary-card success">
                <div class="value" id="generalAvg">R$ 0,00</div>
                <div class="label">Média Geral</div>
            </div>
            <div class="summary-card danger">
                <div class="value" id="totalBelow">0</div>
                <div class="label">Abaixo do Mínimo</div>
            </div>
        </div>

        <!-- Results -->
        <div class="results" id="results"></div>

        <!-- Empty -->
        <div class="empty-state" id="emptyState">
            <p>Nenhuma oferta encontrada para este produto.</p>
        </div>
    </div>

    <script>
        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('active');
        }

        // Enter key to search
        document.getElementById('product').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        async function doSearch() {
            const product = document.getElementById('product').value.trim();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || null;
            const crawl4aiUrl = document.getElementById('crawl4aiUrl').value.trim();

            if (!product) {
                document.getElementById('product').focus();
                return;
            }

            // UI state
            const btn = document.getElementById('btnSearch');
            btn.disabled = true;
            btn.textContent = 'Pesquisando...';
            document.getElementById('loading').classList.add('active');
            document.getElementById('summary').classList.remove('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('emptyState').classList.remove('active');

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product,
                        min_price: minPrice,
                        crawl4ai_url: crawl4aiUrl
                    })
                });

                const data = await response.json();
                renderResults(data);

            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('emptyState').classList.add('active');
                document.getElementById('emptyState').innerHTML = '<p>Erro na pesquisa. Verifique se o servidor está rodando.</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Pesquisar';
                document.getElementById('loading').classList.remove('active');
            }
        }

        function formatPrice(price) {
            return 'R$ ' + price.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderResults(data) {
            // Summary
            document.getElementById('totalOffers').textContent = data.total_offers;
            document.getElementById('generalAvg').textContent = formatPrice(data.general_average);
            document.getElementById('totalBelow').textContent = data.total_below_min;

            if (data.total_offers === 0) {
                document.getElementById('emptyState').classList.add('active');
                return;
            }

            document.getElementById('summary').classList.add('active');

            // Results
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = '';

            for (const mp of data.results) {
                const block = document.createElement('div');
                block.className = 'marketplace-block';

                let offersHTML = '';
                for (const offer of mp.offers) {
                    const rowClass = offer.below_min ? 'row-below-min' : '';
                    const alertBadge = offer.below_min ? '<span class="badge-alert">Abaixo do mínimo</span>' : '';

                    offersHTML += `
                        <tr class="${rowClass}">
                            <td class="seller-name">${offer.seller}</td>
                            <td class="price">${formatPrice(offer.price)}${alertBadge}</td>
                            <td><a href="${offer.link}" target="_blank" rel="noopener">Ver oferta →</a></td>
                        </tr>
                    `;
                }

                block.innerHTML = `
                    <div class="marketplace-header">
                        <div class="name">${mp.marketplace}</div>
                        <div class="stats">
                            <div class="stat">
                                <div class="val">${mp.total_offers}</div>
                                <div class="lbl">Ofertas</div>
                            </div>
                            <div class="stat">
                                <div class="val">${formatPrice(mp.average)}</div>
                                <div class="lbl">Média</div>
                            </div>
                        </div>
                    </div>
                    <table class="offers-table">
                        <thead>
                            <tr>
                                <th>Vendedor</th>
                                <th>Preço</th>
                                <th>Link</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${offersHTML}
                        </tbody>
                    </table>
                `;

                resultsEl.appendChild(block);
            }

            resultsEl.classList.add('active');
        }
    </script>
</body>
</html>
